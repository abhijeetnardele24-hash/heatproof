<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FBF9F5; }
      .card { fill: #FFFFFF; stroke: #E5DFC8; stroke-width: 1.5; rx: 10px; }
      .card-accent { fill: #FFFFFF; stroke: #0D9488; stroke-width: 2; rx: 10px; }
      .header-bg { fill: #F3EFEA; rx: 8px 8px 0 0; }
      .header-accent { fill: #0D9488; rx: 8px 8px 0 0; }
      .title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 800; fill: #1C2024; }
      .subtitle { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 500; fill: #57606A; }
      .card-title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #1C2024; }
      .card-title-white { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #FFFFFF; }
      .text-body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 12px; fill: #333C48; }
      .text-muted { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 11px; fill: #6B7280; }
      .mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #0D9488; font-weight: 600; }
      .badge { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; }
      .conn-line { stroke: #99F6E4; stroke-width: 2; stroke-dasharray: 4,4; fill: none; }
      .solid-line { stroke: #0D9488; stroke-width: 2; fill: none; }
      .arrow { fill: #0D9488; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0D9488"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" class="bg" />

  <!-- Master Title & Metadata -->
  <g transform="translate(60, 45)">
    <text class="title">HeatProof: System Architecture &amp; Cryptographic Adaptation Flow</text>
    <text y="24" class="subtitle">Verifiable Proof-of-Adaptation Network for Extreme-Heat Relief Infrastructure • IEEE ClimateChain 2026</text>
  </g>

  <!-- COLUMN 1: Ingestion & Physical Telemetry -->
  <g transform="translate(60, 100)">
    <!-- Card 1: Climate Hazard Engine -->
    <rect width="240" height="180" class="card" />
    <path d="M 0 0 h 240 v 35 h -240 z" class="header-bg" />
    <text x="15" y="22" class="card-title">1. Meteorological Hazards</text>
    <text x="15" y="60" class="text-body">• Open-Meteo REST API (Live)</text>
    <text x="15" y="80" class="text-muted">  Ambient 26.2°C • 64% RH • UV 0</text>
    <text x="15" y="105" class="text-body">• NOAA Rothfusz &amp; Steadman</text>
    <text x="15" y="125" class="text-muted">  Heat Index HI = 26.5°C</text>
    <text x="15" y="150" class="mono">Isotherm Triggers: 42°C &amp; 45°C</text>

    <!-- Card 2: Privacy Boundary Sanitizer -->
    <g transform="translate(0, 210)">
      <rect width="240" height="210" class="card-accent" />
      <path d="M 0 0 h 240 v 35 h -240 z" class="header-accent" />
      <text x="15" y="22" class="card-title-white">2. Privacy Sanitizer</text>
      <text x="15" y="60" class="text-body">• Client-Side EXIF Stripping</text>
      <text x="15" y="80" class="text-muted">  GPS &amp; camera metadata dropped</text>
      <text x="15" y="105" class="text-body">• Coordinate Coarsening</text>
      <text x="15" y="125" class="mono">  ~1.1km grid (0.01° lat/lng)</text>
      <text x="15" y="150" class="text-body">• Zero-PII Regex Redactor</text>
      <text x="15" y="170" class="text-muted">  Phones, Aadhaar, names scrubbed</text>
      <text x="15" y="195" class="mono">SHA-256 Canonical Hasher</text>
    </g>

    <!-- Card 3: Multimodal AI Assistant -->
    <g transform="translate(0, 450)">
      <rect width="240" height="190" class="card" />
      <path d="M 0 0 h 240 v 35 h -240 z" class="header-bg" />
      <text x="15" y="22" class="card-title">3. Responsible AI Assistant</text>
      <text x="15" y="60" class="text-body">• "AI Proposes; Humans Decide"</text>
      <text x="15" y="80" class="text-muted">  Never mutates ledger state directly</text>
      <text x="15" y="105" class="text-body">• Prompt Injection Defense</text>
      <text x="15" y="125" class="text-muted">  Unicode clean + jailbreak filter</text>
      <text x="15" y="150" class="text-body">• 12-Case Benchmark Validated</text>
      <text x="15" y="170" class="mono">100% Acc • 1.0 F1 • 41.7% Abstain</text>
    </g>
  </g>

  <!-- COLUMN 2: Consensus, Attestation & State Machine Engine -->
  <g transform="translate(350, 100)">
    <!-- Card 4: Attestation State Machine -->
    <rect width="260" height="300" class="card-accent" />
    <path d="M 0 0 h 260 v 35 h -240 z" class="header-accent" />
    <text x="15" y="22" class="card-title-white">4. 9-State Invariant FSM</text>
    
    <g transform="translate(15, 55)">
      <rect width="105" height="26" rx="4" fill="#F0FDFA" stroke="#0D9488" />
      <text x="8" y="17" class="badge" fill="#0D9488">PROPOSED_AVAIL</text>
      
      <line x1="105" y1="13" x2="135" y2="13" class="solid-line" marker-end="url(#arrow)" />
      
      <rect x="135" width="100" height="26" rx="4" fill="#0D9488" />
      <text x="143" y="17" class="badge" fill="#FFFFFF">VERIFIED_AVAIL</text>
    </g>

    <g transform="translate(15, 100)">
      <rect width="105" height="26" rx="4" fill="#FEF3C7" stroke="#D97706" />
      <text x="8" y="17" class="badge" fill="#D97706">RESTORING_REP</text>
      
      <line x1="105" y1="13" x2="135" y2="13" class="solid-line" marker-end="url(#arrow)" />
      
      <rect x="135" width="100" height="26" rx="4" fill="#FEE2E2" stroke="#DC2626" />
      <text x="143" y="17" class="badge" fill="#DC2626">VERIFIED_UNAV</text>
    </g>

    <text x="15" y="160" class="text-body">• Quorum Threshold: N ≥ 2</text>
    <text x="15" y="180" class="text-muted">  Independent witness corroboration</text>
    <text x="15" y="205" class="text-body">• Heat Escalation Priority</text>
    <text x="15" y="225" class="text-muted">  HI &gt; 42°C accelerates dispatch</text>
    <text x="15" y="250" class="text-body">• Outage &amp; Stale Thresholds</text>
    <text x="15" y="270" class="mono">  TTL &gt; 180 min without check-in</text>
  </g>

  <!-- Card 5: Adaptation Service Receipts (ASR) Engine -->
  <g transform="translate(350, 430)">
    <rect width="260" height="210" class="card" />
    <path d="M 0 0 h 260 v 35 h -240 z" class="header-bg" />
    <text x="15" y="22" class="card-title">5. Adaptation Receipts (ASR)</text>
    <text x="15" y="60" class="text-body">• Merkle Tree Aggregation</text>
    <text x="15" y="80" class="text-muted">  Canonical leaf pairs sha256(a + b)</text>
    <text x="15" y="105" class="text-body">• Service Delivery Metrics</text>
    <text x="15" y="125" class="text-muted">  People protected, liters dispensed</text>
    <text x="15" y="150" class="text-body">• Fail-Closed Cryptographic Check</text>
    <text x="15" y="170" class="mono">  Zero-Knowledge tamper resistance</text>
    <text x="15" y="195" class="mono">Export: JSON Audit Bundle</text>
  </g>

  <!-- COLUMN 3: Blockchain Proof Ledger -->
  <g transform="translate(660, 100)">
    <rect width="240" height="300" class="card-accent" />
    <path d="M 0 0 h 240 v 35 h -240 z" class="header-accent" />
    <text x="15" y="22" class="card-title-white">6. Proof Ledger Adapter</text>
    
    <text x="15" y="60" class="text-body">• Multi-Provider Architecture</text>
    <text x="15" y="80" class="text-muted">  EVM viem client + Hash Chain</text>
    
    <text x="15" y="110" class="text-body">• EVM Live Testnet Mode</text>
    <text x="15" y="130" class="mono">  Arbitrum Sepolia (421614)</text>
    <text x="15" y="150" class="text-muted">  Tx: 0x5191861d07...9ad0</text>
    
    <text x="15" y="180" class="text-body">• Deterministic Fallback</text>
    <text x="15" y="200" class="text-muted">  SHA-256 block chain ledger</text>
    <text x="15" y="220" class="text-muted">  Runs 100% offline via SW</text>

    <text x="15" y="250" class="text-body">• Live Verification Status</text>
    <text x="15" y="270" class="mono">Verified on Explorer (Arbiscan)</text>
  </g>

  <!-- Card 7: Civic Operations & Policy Command -->
  <g transform="translate(660, 430)">
    <rect width="240" height="210" class="card" />
    <path d="M 0 0 h 240 v 35 h -240 z" class="header-bg" />
    <text x="15" y="22" class="card-title">7. Policy &amp; Operations</text>
    <text x="15" y="60" class="text-body">• Zone Thermal Coverage KPI</text>
    <text x="15" y="80" class="text-muted">  Active facilities vs. population</text>
    <text x="15" y="105" class="text-body">• Priority Outage Queue</text>
    <text x="15" y="125" class="text-muted">  Ranked by Heat Index severity</text>
    <text x="15" y="150" class="text-body">• Audit Bundle Downloader</text>
    <text x="15" y="170" class="mono">  One-click verifiable receipt</text>
    <text x="15" y="195" class="mono">ESG &amp; Climate Loss Compliance</text>
  </g>

  <!-- COLUMN 4: Presentation & Multi-Device Surface -->
  <g transform="translate(940, 100)">
    <rect width="200" height="540" class="card" />
    <path d="M 0 0 h 200 v 35 h -200 z" class="header-bg" />
    <text x="15" y="22" class="card-title">8. Civic UI &amp; PWA</text>
    
    <text x="15" y="65" class="text-body">• Mineral Civic Theme</text>
    <text x="15" y="85" class="text-muted">  Cream, warm stone, teal</text>
    
    <text x="15" y="115" class="text-body">• Responsive Viewports</text>
    <text x="15" y="135" class="text-muted">  320px to 1920px verified</text>
    <text x="15" y="155" class="mono">  Mobile, Tablet, Desktop</text>

    <text x="15" y="185" class="text-body">• Multilingual Wayfinding</text>
    <text x="15" y="205" class="mono">  English • हिंदी • मराठी</text>

    <text x="15" y="235" class="text-body">• Accessibility Standard</text>
    <text x="15" y="255" class="mono">  WCAG 2.2 AA (0 Violations)</text>
    <text x="15" y="275" class="text-muted">  Axe automated scan passed</text>

    <text x="15" y="305" class="text-body">• Progressive Web App</text>
    <text x="15" y="325" class="text-muted">  ServiceWorker cache v1</text>
    <text x="15" y="345" class="text-muted">  Offline reload verified</text>

    <text x="15" y="380" class="text-body">• Interactive Topology</text>
    <text x="15" y="400" class="text-muted">  SVG Isotherm Map</text>

    <text x="15" y="435" class="text-body">• Evidence Inspector</text>
    <text x="15" y="455" class="mono">  SHA-256 Preimage view</text>

    <text x="15" y="490" class="text-body">• Proof Strip</text>
    <text x="15" y="510" class="mono">  Verified On-Chain badge</text>
  </g>

  <!-- Connecting Inter-Module Flows -->
  <!-- Col 1 to Col 2 -->
  <path d="M 300 180 L 350 180" class="solid-line" marker-end="url(#arrow)" />
  <path d="M 300 315 L 350 315" class="solid-line" marker-end="url(#arrow)" />
  <path d="M 300 540 L 350 540" class="solid-line" marker-end="url(#arrow)" />

  <!-- Col 2 to Col 3 -->
  <path d="M 610 250 L 660 250" class="solid-line" marker-end="url(#arrow)" />
  <path d="M 610 535 L 660 535" class="solid-line" marker-end="url(#arrow)" />

  <!-- Col 3 to Col 4 -->
  <path d="M 900 250 L 940 250" class="solid-line" marker-end="url(#arrow)" />
  <path d="M 900 535 L 940 535" class="solid-line" marker-end="url(#arrow)" />

  <!-- Footer Banner -->
  <g transform="translate(60, 680)">
    <rect width="1080" height="70" rx="8" fill="#F3EFEA" stroke="#E5DFC8" stroke-width="1" />
    <text x="25" y="30" class="card-title" fill="#0D9488">Verified Invariants: Zero PII on-chain • Human Agency Preserved • Cryptographic Merkle Accountability</text>
    <text x="25" y="52" class="text-muted">Built for municipal resilience officers, field disaster volunteers, and climate loss &amp; damage funds requiring verifiable proof of physical adaptation.</text>
  </g>
</svg>
