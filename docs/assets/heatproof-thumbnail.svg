      </text>
      <text x="20" y="128" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#F59E0B">
        Self-Attest Filtered
      </text>
    </g>

    <!-- Card 3: Hazard Intelligence -->
    <g transform="translate(540, 0)" filter="url(#softShadow)">
      <rect width="250" height="150" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <rect width="250" height="4" rx="2" fill="#3B82F6" />
      <text x="20" y="36" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">
