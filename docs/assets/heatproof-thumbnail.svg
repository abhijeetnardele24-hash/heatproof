<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />

  <!-- Subtle Thermal Grid Pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="400" x2="1280" y2="400" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="560" x2="1280" y2="560" />
    <line x1="0" y1="640" x2="1280" y2="640" />
    <line x1="160" y1="0" x2="160" y2="720" />
    <line x1="320" y1="0" x2="320" y2="720" />
    <line x1="480" y1="0" x2="480" y2="720" />
    <line x1="640" y1="0" x2="640" y2="720" />
    <line x1="800" y1="0" x2="800" y2="720" />
    <line x1="960" y1="0" x2="960" y2="720" />
    <line x1="1120" y1="0" x2="1120" y2="720" />
  </g>

  <!-- Heat Ring Accents (Background Ambient) -->
  <circle cx="1080" cy="200" r="280" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.12" stroke-dasharray="8 6" />
  <circle cx="1080" cy="200" r="200" fill="none" stroke="#EF4444" stroke-width="1.5" opacity="0.10" />
  <circle cx="1080" cy="200" r="120" fill="none" stroke="#14B8A6" stroke-width="2" opacity="0.15" />

  <!-- Hackathon Track Ribbon -->
  <g transform="translate(80, 56)">
    <rect width="450" height="34" rx="17" fill="rgba(15, 118, 110, 0.25)" stroke="#14B8A6" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#14B8A6" filter="url(#glow)" />
    <text x="36" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#2DD4BF" letter-spacing="0.06em">
      IEEE CLIMATECHAIN GLOBAL HACKATHON 2026
    </text>
  </g>

  <!-- Main Hero Brand & Logo -->
  <g transform="translate(80, 115)">
    <!-- Logo Icon -->
    <g filter="url(#glow)">
      <rect width="64" height="64" rx="16" fill="url(#tealGrad)" />
      <!-- Shield & Checkmark Path -->
      <path d="M32 14 L46 20 V33 C46 43 39 50 32 54 C25 50 18 43 18 33 V20 Z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />
      <path d="M26 33 L30 37 L39 28" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Wordmark -->
    <text x="82" y="46" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF" letter-spacing="-0.03em">
      Heat<tspan fill="#2DD4BF">Proof</tspan>
    </text>
  </g>

  <!-- Tagline & Description -->
  <g transform="translate(80, 215)">
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC" letter-spacing="-0.01em">
      Verifiable Proof-of-Adaptation Network
    </text>
    <text y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="700" fill="#F59E0B" letter-spacing="-0.01em">
      for Extreme-Heat Relief Infrastructure
    </text>
    <text y="78" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" fill="#94A3B8" font-weight="400">
      Decentralized civic wayfinding &amp; cryptographic operational evidence anchored with zero PII.
    </text>
    <text y="104" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" fill="#94A3B8" font-weight="400">
      Multi-agent deterministic quorum eliminates ghost facilities during lethal urban heat events.
    </text>
  </g>

  <!-- Key Architecture Feature Cards -->
  <g transform="translate(80, 365)">
    <!-- Card 1: Zero-PII Cryptography -->
    <g filter="url(#softShadow)">
      <rect width="250" height="150" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <rect width="250" height="4" rx="2" fill="#14B8A6" />
      <text x="20" y="36" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">
        Zero-PII Evidence
      </text>
      <text x="20" y="62" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#94A3B8">
