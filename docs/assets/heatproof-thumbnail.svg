      </text>
      <text x="14" y="54" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="#10B981">
        ✓ Quorum satisfied (3/2)
      </text>
    </g>

    <!-- Audit Proof Badge -->
    <g transform="translate(20, 305)">
      <rect width="260" height="75" rx="8" fill="rgba(15, 118, 110, 0.15)" stroke="#0D9488" stroke-width="1.2" />
      <text x="14" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#2DD4BF">
        VERIFIABLE AUDIT RECEIPT
      </text>
      <text x="14" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#94A3B8">
        Full JSON cryptographic export
      </text>
      <text x="14" y="60" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" fill="#94A3B8">
        Transparent open verification
      </text>
    </g>
  </g>

  <!-- Bottom Proof & Truthfulness Badges -->
  <g transform="translate(80, 560)">
    <!-- Badge 1: 100% WCAG 2.2 AA -->
    <g>
      <rect width="180" height="42" rx="21" fill="rgba(16, 185, 129, 0.12)" stroke="#10B981" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#10B981" />
      <text x="36" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#34D399">
        Axe WCAG 2.2 AA (0 Violations)
      </text>
    </g>

    <!-- Badge 2: 56 Playwright E2E Tests -->
    <g transform="translate(195, 0)">
      <rect width="175" height="42" rx="21" fill="rgba(20, 184, 166, 0.12)" stroke="#14B8A6" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#14B8A6" />
      <text x="36" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#2DD4BF">
        56 E2E Tests Passing
      </text>
    </g>

    <!-- Badge 3: 82 Unit Tests -->
    <g transform="translate(385, 0)">
      <rect width="165" height="42" rx="21" fill="rgba(59, 130, 246, 0.12)" stroke="#3B82F6" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#3B82F6" />
      <text x="36" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#60A5FA">
        107 Vitest Units (87.4%)
      </text>
    </g>

    <!-- Badge 4: PII-Minimized Evidence -->
    <g transform="translate(565, 0)">
      <rect width="185" height="42" rx="21" fill="rgba(245, 158, 11, 0.12)" stroke="#F59E0B" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#F59E0B" />
      <text x="36" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#FBBF24">
        PII-Minimized Evidence
      </text>
    </g>

    <!-- Badge 5: Open Source MIT -->
    <g transform="translate(755, 0)">
      <rect width="140" height="42" rx="21" fill="rgba(148, 163, 184, 0.12)" stroke="#64748B" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#94A3B8" />
      <text x="36" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#CBD5E1">
        MIT License
      </text>
    </g>
  </g>

  <!-- Footer Track Link -->
  <g transform="translate(80, 660)">
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#64748B">
      Track: Climate Data &amp; Environmental Monitoring • https://ieee-climatechain-hack.devpost.com/
    </text>
