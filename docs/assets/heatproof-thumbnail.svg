  <!-- Right Visual Mockup: Thermal Gauge & Integrity Badges -->
  <g transform="translate(900, 115)" filter="url(#softShadow)">
    <rect width="300" height="400" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Card Header -->
    <rect width="300" height="46" rx="16 16 0 0" fill="#0F172A" />
    <circle cx="25" cy="23" r="5" fill="#EF4444" />
    <circle cx="42" cy="23" r="5" fill="#F59E0B" />
    <circle cx="59" cy="23" r="5" fill="#10B981" />
    <text x="80" y="28" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8">
