      </text>
      <rect x="14" y="34" width="130" height="24" rx="12" fill="#064E3B" stroke="#059669" stroke-width="1" />
      <text x="26" y="50" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#34D399">
