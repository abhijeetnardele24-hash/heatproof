      </text>
      <text x="20" y="84" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#94A3B8">
        • 4 Indian heat hubs supported
      </text>
      <text x="20" y="106" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#94A3B8">
        • Deterministic rule assistance
      </text>
      <text x="20" y="128" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#60A5FA">
        Open-Meteo Live API
      </text>
    </g>
