    <!-- Facility Status Box -->
    <g transform="translate(20, 65)">
      <rect width="260" height="70" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="#1E293B" />
      <text x="14" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="0.04em">
