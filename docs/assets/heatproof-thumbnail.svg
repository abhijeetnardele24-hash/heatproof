      </text>
      <text x="20" y="128" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#2DD4BF">
        Preimage SHA-256
      </text>
    </g>

    <!-- Card 2: Deterministic State Machine -->
    <g transform="translate(270, 0)" filter="url(#softShadow)">
      <rect width="250" height="150" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
      <rect width="250" height="4" rx="2" fill="#F59E0B" />
      <text x="20" y="36" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">
        Deterministic Quorum
      </text>
      <text x="20" y="62" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#94A3B8">
        • 2 independent witnesses
      </text>
      <text x="20" y="84" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#94A3B8">
        • Anti-Sybil address deduplication
      </text>
      <text x="20" y="106" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#94A3B8">
