      </text>
    </g>

    <!-- SHA-256 Digest Box -->
    <g transform="translate(20, 150)">
      <rect width="260" height="60" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="#1E293B" />
      <text x="14" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748B">
        SHA-256 EVIDENCE DIGEST:
      </text>
      <text x="14" y="42" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#2DD4BF">
        0x1e8338f0...6e583cc
      </text>
    </g>

    <!-- Quorum Rule Box -->
    <g transform="translate(20, 225)">
      <rect width="260" height="65" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="#1E293B" />
      <text x="14" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748B">
        CONSENSUS QUORUM:
      </text>
      <text x="14" y="40" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#F8FAFC">
